services:
  - type: web
    name: bookshelf-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: bookshelf
      - key: CORS_ORIGINS
        sync: false
      - key: KEEP_ALIVE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9

  - type: web
    name: bookshelf-web
    runtime: static
    rootDir: frontend
    buildCommand: yarn install --frozen-lockfile && yarn build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_BACKEND_URL
        sync: false
      - key: DISABLE_EMERGENT_OVERLAY
        value: "true"
      - key: NODE_VERSION
        value: 20.18.0
